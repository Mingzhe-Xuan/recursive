[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "recursive-atomistic-backbones"
version = "0.1.0"
description = "Frozen atomistic backbone recursion with irrep-level norm alignment"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
mattersim = ["mattersim==1.2.3"]
mace = ["mace-torch==0.3.16"]
self-evolution = ["numpy>=1.26,<2", "pymatgen==2024.5.1", "matplotlib>=3.8,<3.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"self_evolution.backbones.cgcnn.upstream" = ["*.json", "LICENSE", "README.md"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
